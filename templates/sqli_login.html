{% extends "base.html" %}
{% block title %}SQLi Login{% endblock %}
{% block content %}
<h2>SQL Injection — Login Bypass</h2>
<p>Try: username <code>admin' --</code> with any password, or <code>' OR '1'='1</code>.</p>
<form method="post">
  <label>Username</label>
  <input type="text" name="username">
  <label>Password</label>
  <input type="password" name="password">
  <button type="submit">Login</button>
</form>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% if result %}<p class="ok">Logged in as: {{ result }}</p>{% endif %}
{% endblock %}
