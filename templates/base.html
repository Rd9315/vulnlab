<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}VulnLab{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  header { border-bottom: 2px solid #c0392b; padding-bottom: .5rem; margin-bottom: 1.5rem; }
  header h1 { color: #c0392b; margin-bottom: .2rem; }
  nav a { margin-right: .8rem; font-size: .9rem; }
  .banner { background: #fdecea; border: 1px solid #c0392b; padding: .6rem .9rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1.2rem; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
  input[type=text], input[type=password], textarea { width: 100%; padding: .5rem; box-sizing: border-box; margin: .3rem 0 .7rem; }
  button { padding: .5rem 1rem; cursor: pointer; }
  code, pre { background: #f4f4f4; padding: .15rem .35rem; border-radius: 4px; }
  pre { padding: .8rem; overflow-x: auto; }
  .err { color: #c0392b; font-weight: bold; }
  .ok { color: #27ae60; font-weight: bold; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
  footer { margin-top: 2rem; font-size: .8rem; color: #888; }
</style>
</head>
<body>
<header>
  <h1>🧪 VulnLab</h1>
  <nav><a href="{{ url_for('index') }}">Home</a></nav>
</header>
<div class="banner">⚠️ Intentionally vulnerable practice app — local/isolated use only.</div>
{% block content %}{% endblock %}
<footer>VulnLab · educational web exploitation sandbox</footer>
</body>
</html>
